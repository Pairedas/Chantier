<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chantier Salon</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chantier">
<style>
/* ════════════════════════════════════════════════════════════════════
   SYSTÈME DE DESIGN (repris de l’appli Caisses)
   Grille 4/8 px · rayons 10/14/20/28 · texte système · chiffres tabulaires
   Thème clair et sombre suivant le téléphone (prefers-color-scheme)
   ════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light dark;
  /* espacements */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
  /* rayons */
  --r1:10px;--r2:14px;--r3:20px;--r4:28px;--rf:999px;
  /* typographie */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --t11:11px;--t12:12px;--t13:13px;--t15:15px;--t17:17px;--t20:20px;--t24:24px;--t28:28px;--t34:34px;--t44:44px;
  /* mouvement */
  --ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  /* hauteur barre d'onglets */
  --tab:64px;

  /* ── Thème clair ── */
  --bg:#F2F3F7;
  --surface:#FFFFFF;
  --surface-2:#F2F3F7;
  --surface-3:#E6E8EE;
  --line:rgba(17,24,39,.08);
  --line-2:rgba(17,24,39,.14);
  --text:#0E1116;
  --text-2:#4A5260;
  --text-3:#646C7A;
  --accent:#4B4FE0;
  --accent-text:#3F43D1;
  --accent-soft:rgba(75,79,224,.10);
  --on-accent:#FFFFFF;
  --pos:#047A50;--pos-soft:rgba(4,122,80,.10);
  --neg:#D02C25;--neg-soft:rgba(208,44,37,.09);
  --warn:#A65500;--warn-soft:rgba(214,120,0,.12);
  --hero-1:#1A1C3D;--hero-2:#0E0F24;
  --toast-bg:#15171D;--toast-text:#F4F5F7;
  --shadow-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-2:0 8px 24px -6px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
  --shadow-3:0 -12px 40px rgba(16,24,40,.18);
  --scrim:rgba(10,12,20,.42);
  --tabbar:rgba(255,255,255,.88);
  --seg-on:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B0C10;
    --surface:#16181E;
    --surface-2:#1E2129;
    --surface-3:#2A2E38;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --text:#F3F4F7;
    --text-2:#A9AFBC;
    --text-3:#8D94A3;
    --accent:#5B5FEF;
    --accent-text:#9DA0FF;
    --accent-soft:rgba(110,114,255,.16);
    --on-accent:#FFFFFF;
    --pos:#3DD598;--pos-soft:rgba(61,213,152,.13);
    --neg:#FF6B63;--neg-soft:rgba(255,107,99,.13);
    --warn:#F5B44A;--warn-soft:rgba(245,180,74,.14);
    --hero-1:#20234A;--hero-2:#121329;
    --toast-bg:#F1F2F6;--toast-text:#0E1116;
    --shadow-1:none;
    --shadow-2:0 10px 30px -8px rgba(0,0,0,.6);
    --shadow-3:0 -12px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.6);
    --tabbar:rgba(18,20,25,.86);
    --seg-on:#343845;
  }
}

/* ── Base ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--t15);line-height:1.45;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + var(--s8))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:none;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap;letter-spacing:-.01em}
.cache{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}.ic.xs{width:16px;height:16px}.ic.l{width:26px;height:26px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mute{color:var(--text-3)}.acc{color:var(--accent-text)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s4)) var(--s4) 0}
.prive .sens{filter:blur(9px);transition:filter .2s}

/* ── En-têtes ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:48px;margin-bottom:var(--s5)}
.hello{font-size:var(--t24);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.date{font-size:var(--t13);color:var(--text-3);margin-top:2px}
.date::first-letter{text-transform:uppercase}
.top-actions{display:flex;gap:var(--s2)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:var(--rf);display:grid;place-items:center;background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);border:1px solid var(--line);transition:transform .12s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.nu{background:none;border:none;box-shadow:none}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.ph{display:flex;align-items:center;gap:var(--s2);min-height:48px;margin-bottom:var(--s4)}
.ph h1{font-size:var(--t28);font-weight:700;letter-spacing:-.02em;line-height:1.15;flex:1;min-width:0}
.ph .back{margin-left:-10px}
.lead{color:var(--text-2);font-size:var(--t15);margin:-4px 0 var(--s5)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin:var(--s8) 2px var(--s3)}
.sec h2{font-size:var(--t17);font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:var(--s2)}
.sec .lien{font-size:var(--t15);font-weight:600;color:var(--accent-text);min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:var(--rf);font-size:var(--t12);font-weight:700;background:var(--warn-soft);color:var(--warn)}
.badge.n{background:var(--surface-3);color:var(--text-2)}

/* ── Surfaces ── */
.card{background:var(--surface);border-radius:var(--r3);box-shadow:var(--shadow-1);border:1px solid var(--line);padding:var(--s4)}
.card+.card{margin-top:var(--s3)}
.card.flush{padding:var(--s1) 0}
.liste>*+*{border-top:1px solid var(--line)}

/* ── Carte patrimoine ── */
.hero{position:relative;overflow:hidden;border-radius:var(--r3);padding:var(--s5) var(--s5) 0;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(122,126,255,.45) 0%,rgba(122,126,255,0) 55%),linear-gradient(160deg,var(--hero-1),var(--hero-2));
  box-shadow:var(--shadow-2)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:var(--t13);color:rgba(255,255,255,.78);font-weight:500}
.hero-amt{font-size:var(--t34);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:var(--s2)}
.cur{font-size:.55em;font-weight:600;margin-left:.22em;opacity:.75;letter-spacing:0}
.hero-var{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:var(--t13);color:rgba(255,255,255,.75)}
.vpill{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--rf);font-size:var(--t12);font-weight:650;background:rgba(255,255,255,.14);color:#fff}
.vpill.up{background:rgba(61,213,152,.22);color:#B7F5D9}.vpill.down{background:rgba(255,107,99,.22);color:#FFD0CD}
.hero-spark{display:block;width:100%;margin:var(--s3) 0 0;height:56px;overflow:visible}
.hero-pied{display:flex;justify-content:space-between;font-size:var(--t11);color:rgba(255,255,255,.62);padding:var(--s2) 0 var(--s3);border-top:1px solid rgba(255,255,255,.08)}

/* ── Cartes caisses (façon cartes bancaires) ── */
.soldes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.solde{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:152px;padding:var(--s4);border-radius:var(--r3);color:#fff;text-align:left;
  background:radial-gradient(140% 100% at 100% 0%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%),linear-gradient(150deg,var(--g1),var(--g2));
  box-shadow:0 6px 18px -8px var(--g2);transition:transform .15s var(--ease)}
.solde::after{content:"";position:absolute;right:-30px;bottom:-46px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.06)}
.solde:active{transform:scale(.97)}
.solde-top{display:flex;justify-content:space-between;align-items:center}
.solde-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.solde-ic .ic{width:18px;height:18px}
.solde .no{font-size:var(--t12);font-weight:600;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.solde .nom{font-size:var(--t15);font-weight:600;margin-top:var(--s3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.solde .mt{font-size:var(--t20);font-weight:700;letter-spacing:-.02em;margin-top:2px}
.solde-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);margin-top:auto;padding-top:var(--s2);position:relative;z-index:1}
.solde .var{font-size:var(--t12);color:#fff;font-weight:600;white-space:nowrap}
.solde .spark{width:56px;height:22px;flex-shrink:0}
.solde .neg-badge{font-size:var(--t11);font-weight:700;background:rgba(0,0,0,.28);padding:2px 6px;border-radius:6px}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:52px;padding:0 var(--s5);border-radius:var(--r2);font-weight:600;font-size:var(--t17);width:100%;
  transition:transform .12s var(--ease),background .2s,opacity .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-pri{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px -6px rgba(75,79,224,.55)}
.btn-sec{background:var(--surface);color:var(--text);border:1px solid var(--line-2);box-shadow:var(--shadow-1)}
.card .btn-sec,.panneau .btn-sec{background:var(--surface-2);border-color:transparent;box-shadow:none}
.btn-soft{background:var(--accent-soft);color:var(--accent-text)}
.btn-pos{background:var(--pos-soft);color:var(--pos)}
.btn-neg{background:var(--neg);color:#fff}
.btn-ghost{background:none;color:var(--accent-text);min-height:44px}
.btn.sm{min-height:44px;font-size:var(--t15);border-radius:var(--r1);padding:0 var(--s4)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.pile>*+*{margin-top:var(--s2)}

/* ── Alertes ── */
.alerte{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r3);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);margin-bottom:var(--s3)}
.alerte .a-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent-text)}
.alerte.ok .a-ic{background:var(--pos-soft);color:var(--pos)}
.alerte.at .a-ic{background:var(--warn-soft);color:var(--warn)}
.alerte.err .a-ic{background:var(--neg-soft);color:var(--neg)}
.alerte .a-b{flex:1;min-width:0}
.alerte .a-t{font-weight:650;font-size:var(--t15)}
.alerte .a-d{color:var(--text-2);font-size:var(--t13);margin-top:2px}
.alerte .btn{margin-top:var(--s3)}

/* ── Lignes d'opération ── */
.tx{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;transition:background .15s}
.tx:active{background:var(--surface-2)}
.tx-ic{width:40px;height:40px;border-radius:var(--rf);display:grid;place-items:center;flex-shrink:0;background:var(--surface-2);color:var(--text-2)}
.tx-ic .ic{width:19px;height:19px}
.t-pos{background:var(--pos-soft);color:var(--pos)}.t-neg{background:var(--neg-soft);color:var(--neg)}.t-acc{background:var(--accent-soft);color:var(--accent-text)}.t-warn{background:var(--warn-soft);color:var(--warn)}
.tx-b{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-t{font-weight:550;font-size:var(--t15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:var(--t13);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-mt{font-weight:600;font-size:var(--t15);text-align:right}
.tx-mt small{display:block;font-size:var(--t12);font-weight:500;color:var(--text-3)}
.jour{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t13);font-weight:600;color:var(--text-3);padding:var(--s5) var(--s1) var(--s2)}
.jour:first-child{padding-top:0}

/* ── Pastilles ── */
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:var(--rf);font-size:var(--t12);font-weight:650;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.p-ok{background:var(--pos-soft);color:var(--pos)}.p-at{background:var(--warn-soft);color:var(--warn)}.p-ko{background:var(--neg-soft);color:var(--neg)}.p-gr{background:var(--surface-3);color:var(--text-2)}

/* ── Avatars de caisse ── */
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(150deg,var(--g1),var(--g2))}
.av .ic{width:19px;height:19px}
.av.sm{width:28px;height:28px;border-radius:9px}.av.sm .ic{width:15px;height:15px}
.av.lg{width:52px;height:52px;border-radius:16px}.av.lg .ic{width:24px;height:24px}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g1);flex-shrink:0}

/* ── Dettes entre caisses ── */
.dette{padding:var(--s4)}
.dette+.dette{border-top:1px solid var(--line)}
.flux{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:var(--s2)}
.flux-p{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.flux-n{font-size:var(--t12);font-weight:600;color:var(--text-2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flux-fl{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:20px}
.flux-mt{font-size:var(--t15);font-weight:700}
.flux-l{position:relative;width:100%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--a),var(--b))}
.flux-l::after{content:"";position:absolute;right:-2px;top:-5px;border-left:9px solid var(--b);border-top:6px solid transparent;border-bottom:6px solid transparent}
.flux-l::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.phrase{font-size:var(--t13);color:var(--text-2);text-align:center;margin:var(--s3) 0}
.phrase b{color:var(--text);font-weight:600}
.dette-tot{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) var(--s4);font-size:var(--t13);color:var(--text-2);background:var(--surface-2);border-radius:var(--r3) var(--r3) 0 0}
.dette-tot b{color:var(--warn);font-size:var(--t15)}

/* ── États vides ── */
.vide{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);color:var(--text-2);font-size:var(--t15)}
.vide .v-ic{width:40px;height:40px;border-radius:var(--rf);display:grid;place-items:center;background:var(--pos-soft);color:var(--pos);flex-shrink:0}
.vide .v-ic.n{background:var(--surface-2);color:var(--text-3)}
.vide .v-t{font-weight:600;color:var(--text)}
.vide .v-d{font-size:var(--t13);color:var(--text-3)}
.vide-g{text-align:center;padding:var(--s10) var(--s6);color:var(--text-2)}
.vide-g .v-ic{width:64px;height:64px;margin:0 auto var(--s4);border-radius:var(--rf);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.vide-g .v-ic .ic{width:28px;height:28px}
.vide-g .v-t{font-size:var(--t17);font-weight:650;color:var(--text);margin-bottom:var(--s1)}
.vide-g .btn{margin-top:var(--s5);width:auto}

/* ── Clôture du jour ── */
.clo-head{display:flex;align-items:center;gap:var(--s4)}
.ring{width:56px;height:56px;flex-shrink:0;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--t13);font-weight:700}
.ring .r-bg{stroke:var(--surface-3)}.ring .r-fg{stroke:var(--accent);transition:stroke-dashoffset .6s var(--ease-out)}
.ring.ok .r-fg{stroke:var(--pos)}
.clo-t{font-weight:650;font-size:var(--t17)}
.clo-s{font-size:var(--t13);color:var(--text-2)}
.cchips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0}
.cchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 8px;border-radius:var(--rf);background:var(--surface-2);font-size:var(--t13);font-weight:550;color:var(--text-2)}
.cchip .ic{width:14px;height:14px;stroke-width:2.4}
.cchip.ok .ic{color:var(--pos)}.cchip.ecart .ic{color:var(--warn)}.cchip.todo .ic{color:var(--text-3)}

/* ── Écarts ── */
.ecart-l{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s4);min-height:68px;transition:background .15s}
.ecart-l:active{background:var(--surface-2)}
.ecart-l .d{text-align:right}
.ecart-l .d small{display:block;font-size:var(--t12);color:var(--warn);font-weight:600}
.ecart-l>.ic:last-child{color:var(--text-3);width:18px;height:18px}
.ecart-l .g{flex:1;min-width:0}
.ecart-l .t{font-weight:600}
.ecart-l .s{font-size:var(--t13);color:var(--text-3)}
.ecart-l .m{font-weight:700}

/* ── Barre d'onglets ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab);align-items:center}
.tab{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:var(--t11);font-weight:600;transition:color .2s}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--accent-text)}
.tab:active .ic{transform:scale(.9)}
.tab .dot{top:8px;right:calc(50% - 18px);box-shadow:0 0 0 2px var(--bg)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:#fff;margin-top:-22px;
  box-shadow:0 10px 24px -6px rgba(75,79,224,.6),0 0 0 5px var(--bg);transition:transform .15s var(--ease)}
.fab .ic{width:26px;height:26px;stroke-width:2.4}
.fab:active{transform:scale(.92)}

/* ── Feuille modale (bottom sheet) ── */
#feuille{display:none}
#feuille.on,#feuille.sort{display:block}
#feuille.sort{pointer-events:none}
.voile{position:fixed;inset:0;background:var(--scrim);z-index:80;animation:fadeIn .25s ease both}
#feuille.sort .voile{animation:fadeOut .22s ease both}
.panneau{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--shadow-3);
  padding:var(--s2) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.panneau.entre{animation:sheetIn .38s var(--ease-out) both}
#feuille.sort .panneau{animation:sheetOut .22s ease-in both}
.panneau.plein{min-height:94vh;min-height:94dvh}
.poignee{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto var(--s2)}
.sh-head{display:flex;align-items:center;gap:var(--s2);min-height:48px;margin-bottom:var(--s3)}
.sh-head h3{flex:1;font-size:var(--t20);font-weight:700;letter-spacing:-.01em;min-width:0}
.sh-head .icon-btn{width:44px;height:44px;background:var(--surface-2);border:none;box-shadow:none}
.sh-head .icon-btn .ic{width:20px;height:20px}
.pas{animation:stepIn .32s var(--ease-out) both}
.lbl{font-size:var(--t13);font-weight:600;color:var(--text-2);margin:var(--s4) 2px var(--s2)}

/* ── Choix d'action (＋) ── */
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tuile{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);min-height:112px;border-radius:var(--r3);background:var(--surface-2);text-align:left;transition:transform .12s var(--ease)}
.tuile:active{transform:scale(.97)}
.tuile .tx-ic{width:44px;height:44px;border-radius:14px}
.tuile b{font-size:var(--t15);font-weight:650}
.tuile span.d{font-size:var(--t12);color:var(--text-3);margin-top:-8px}

/* ── Segment ── */
.seg2{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:var(--r2);background:var(--surface-2);gap:4px}
.seg2 button{min-height:44px;border-radius:11px;font-weight:600;font-size:var(--t15);color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s}
.seg2 button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg2 button.on[data-val="entree"] .ic{color:var(--pos)}.seg2 button.on[data-val="sortie"] .ic{color:var(--neg)}

/* ── Montant + pavé numérique ── */
.montant{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:var(--s4) 0 var(--s1);min-height:76px;font-size:var(--t44);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.montant.l1{font-size:38px}.montant.l2{font-size:32px}
.montant .montant-c{font-size:.5em;font-weight:600;color:var(--text-3)}
.montant.vide .montant-v{color:var(--text-3)}
.montant.secoue{animation:secoue .3s}
.ctx{text-align:center;font-size:var(--t13);color:var(--text-3);min-height:20px;margin-bottom:var(--s3)}
.ctx b{font-weight:600;color:var(--text-2)}
.ctx b.neg{color:var(--neg)}.ctx b.pos{color:var(--pos)}
.ctx .ic{vertical-align:-3px}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:var(--s3) 0}
.touche{height:52px;border-radius:var(--r2);background:var(--surface-2);font-size:var(--t24);font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:background .1s,transform .1s;user-select:none;-webkit-user-select:none}
.touche:active{background:var(--surface-3);transform:scale(.96)}
.touche[data-k="000"]{font-size:var(--t20)}
.touche[data-k="del"] .ic{width:24px;height:24px}

/* ── Clôture point OM : électronique / espèces ── */
.part{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--s2) var(--s3);border-radius:var(--r2);background:var(--surface-2);border:1.5px solid transparent;text-align:left;min-height:56px;transition:border-color .15s,background .15s}
.part span{display:inline-flex;align-items:center;gap:5px;font-size:var(--t12);font-weight:600;color:var(--text-3)}
.part b{font-size:var(--t17);font-weight:650}
.part.on{border-color:var(--accent);background:var(--accent-soft)}
.part.on span{color:var(--accent-text)}

/* ── Puces (chips) ── */
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--s4));padding:2px var(--s4);scroll-padding:var(--s4)}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-c{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.puce{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:var(--rf);background:var(--surface-2);border:1.5px solid transparent;font-size:var(--t15);font-weight:550;color:var(--text);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.puce .ic{width:17px;height:17px;color:var(--text-3)}
.puce.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.puce.on .ic{color:var(--accent-text)}
.puce.caisse.on{background:color-mix(in srgb,var(--g1) 14%,transparent);border-color:var(--g1);color:var(--text)}
.puce:active{transform:scale(.96)}
.date-p{position:relative;cursor:pointer}
.date-p input{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);opacity:0;cursor:pointer;border:0}

/* ── Champs ── */
.field{width:100%;min-height:50px;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r2);padding:12px 14px;font-size:var(--t17);color:var(--text);transition:border-color .15s,background .15s}
.field::placeholder{color:var(--text-3)}
.field:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.field{min-height:88px;resize:vertical}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.form-l{display:block;font-size:var(--t13);font-weight:600;color:var(--text-2);margin:var(--s4) 2px 6px}
.form-l:first-child{margin-top:0}
.aide{font-size:var(--t13);color:var(--text-3);margin-top:6px}
.bascule{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--warn-soft);margin-top:var(--s3);font-size:var(--t13);color:var(--text);cursor:pointer}
.bascule input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:var(--accent)}

/* ── Clôture pas à pas ── */
.prog{display:flex;gap:4px;margin:var(--s1) 0 var(--s3)}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
.prog i.f{background:var(--accent)}
.prog i.c::after{content:"";position:absolute;inset:0;width:50%;background:var(--accent);border-radius:2px}
.etape{font-size:var(--t13);font-weight:600;color:var(--text-3);flex:1}
.wiz-c{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r3);color:#fff;
  background:radial-gradient(140% 120% at 100% 0%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%),linear-gradient(150deg,var(--g1),var(--g2))}
.wiz-c .solde-ic{width:40px;height:40px;border-radius:12px}
.wiz-c b{display:block;font-size:var(--t17);font-weight:650}
.wiz-c span{font-size:var(--t13);color:#fff;opacity:.92}
.att{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) var(--s4);margin-top:var(--s3);border-radius:var(--r2);background:var(--surface-2);font-size:var(--t15);color:var(--text-2)}
.att b{color:var(--text);font-size:var(--t17)}
details.detail{margin-top:var(--s2)}
details.detail summary{list-style:none;display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:var(--t13);font-weight:600;color:var(--accent-text);cursor:pointer;padding:0 2px}
details.detail summary::-webkit-details-marker{display:none}
details.detail summary .ic{width:15px;height:15px;transition:transform .2s}
details.detail[open] summary .ic{transform:rotate(90deg)}
.res{text-align:center;padding:var(--s5) var(--s4);border-radius:var(--r3);margin-top:var(--s3)}
.res.neg{background:var(--neg-soft)}.res.pos{background:var(--pos-soft)}.res.ok{background:var(--pos-soft)}
.res-ic{width:48px;height:48px;border-radius:var(--rf);display:grid;place-items:center;margin:0 auto var(--s2);color:#fff}
.res.neg .res-ic{background:var(--neg)}.res.pos .res-ic,.res.ok .res-ic{background:var(--pos)}
@media (prefers-color-scheme:dark){.res.pos .res-ic,.res.ok .res-ic{color:#05301F}.res.neg .res-ic{color:#3A0806}}
.res-lbl{font-size:var(--t15);font-weight:600;color:var(--text-2)}
.res-mt{font-size:var(--t34);font-weight:700;letter-spacing:-.03em;margin:2px 0 var(--s2)}
.res.neg .res-mt{color:var(--neg)}.res.pos .res-mt,.res.ok .res-mt{color:var(--pos)}
.res .aide{margin-top:var(--s2)}
.boite{padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--surface-2)}
.boite span{display:block;font-size:var(--t12);color:var(--text-3);font-weight:500}
.boite b{font-size:var(--t17);font-weight:650}
.act-l{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--surface-2);text-align:left;transition:transform .12s}
.act-l:active{transform:scale(.98)}
.act-l .g{flex:1;min-width:0}
.act-l .t{font-weight:600}.act-l .s{font-size:var(--t13);color:var(--text-3)}
.act-l>.ic:last-child{color:var(--text-3);width:18px;height:18px}
.bloc{padding:var(--s4);border-radius:var(--r2);border:1.5px solid var(--line-2);margin-top:var(--s2)}
.fin{text-align:center;padding:var(--s6) var(--s4) var(--s4)}
.fin .res-ic{width:72px;height:72px;margin-bottom:var(--s4)}
.fin .res-ic .ic{width:34px;height:34px;stroke-width:2.4}
.fin h3{font-size:var(--t24);font-weight:700;letter-spacing:-.02em}
.fin p{color:var(--text-2);margin-top:var(--s1)}
.fin.ok .res-ic{background:var(--pos);color:#fff}.fin.at .res-ic{background:var(--warn);color:#fff}
.ligne-r{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);min-height:60px}
.ligne-r .g{flex:1;min-width:0;font-weight:600}
.ligne-r .d{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.note-l{padding:var(--s3) var(--s4)}
.note-l .t{font-weight:500}.note-l .s{font-size:var(--t12);color:var(--text-3)}

/* ── Tableaux ── */
.tableau{width:100%;border-collapse:collapse;font-size:var(--t15)}
.tableau td{padding:9px 0;border-top:1px solid var(--line);color:var(--text-2)}
.tableau td:last-child{text-align:right;color:var(--text);font-weight:550}
.tableau tr:first-child td{border-top:none}
.tableau tr.fort td{font-weight:700;color:var(--text);border-top:1.5px solid var(--line-2)}
.tableau td.z{color:var(--text-3);font-weight:400}

/* ── Bilan ── */
.mois-nav{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);border-radius:var(--rf);padding:4px;margin-bottom:var(--s4)}
.mois-nav b{font-size:var(--t15);font-weight:650;text-transform:capitalize}
.mois-nav .icon-btn{border:none;box-shadow:none;background:var(--surface-2)}
.mois-nav .icon-btn:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.kpi{padding:var(--s4);border-radius:var(--r3);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);min-width:0}
.kpi>span:first-child{display:block;font-size:var(--t13);color:var(--text-2);font-weight:500}
.kpi b{display:block;font-size:var(--t20);font-weight:700;letter-spacing:-.02em;margin:4px 0 6px;overflow:hidden;text-overflow:ellipsis}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:var(--t12);font-weight:650;padding:2px 7px;border-radius:var(--rf);background:var(--surface-2);color:var(--text-2)}
.delta.bon{background:var(--pos-soft);color:var(--pos)}.delta.mauvais{background:var(--neg-soft);color:var(--neg)}
.delta .ic{width:12px;height:12px;stroke-width:2.6}
.kpi small{display:block;font-size:var(--t11);color:var(--text-3);margin-top:4px}
.ch-t{font-size:var(--t17);font-weight:650}
.ch-s{font-size:var(--t13);color:var(--text-3);margin-bottom:var(--s3)}
.legende{display:flex;gap:var(--s4);font-size:var(--t12);color:var(--text-2);margin-top:var(--s2)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.graph{display:block;width:100%;height:auto;overflow:visible}
.graph text{font-family:var(--font);font-size:10px;fill:var(--text-3);font-variant-numeric:tabular-nums}
.graph .grille{stroke:var(--line);stroke-width:1}
.b-in{fill:var(--pos)}.b-out{fill:var(--neg)}
.donut-w{display:flex;align-items:center;gap:var(--s4)}
.donut-w svg{width:132px;height:132px;flex-shrink:0}
.donut-c{font-family:var(--font)}
.cats{flex:1;min-width:0}
.cat-l{display:flex;align-items:center;gap:var(--s2);font-size:var(--t13);padding:5px 0}
.cat-l i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cat-l span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.cat-l b{font-weight:600}
.cat-l em{font-style:normal;color:var(--text-3);width:36px;text-align:right}
.cmp{display:grid;grid-template-columns:72px 1fr;gap:6px var(--s3);align-items:center;font-size:var(--t13)}
.cmp .k{color:var(--text-2);font-weight:550}
.barre-c{display:flex;align-items:center;gap:var(--s2)}
.barre-c i{display:block;height:10px;border-radius:5px;min-width:3px;transition:width .6s var(--ease-out)}
.barre-c em{font-style:normal;font-size:var(--t12);color:var(--text-2);white-space:nowrap}
.caisse-d{border-top:1px solid var(--line)}
.caisse-d:first-child{border-top:none}
.caisse-d summary{list-style:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);min-height:64px;cursor:pointer}
.caisse-d summary::-webkit-details-marker{display:none}
.caisse-d summary .g{flex:1;min-width:0}
.caisse-d summary .g b{display:block;font-weight:600}
.caisse-d summary .g span{font-size:var(--t13);color:var(--text-3)}
.caisse-d summary>.ic{color:var(--text-3);width:18px;height:18px;transition:transform .2s}
.caisse-d[open] summary>.ic{transform:rotate(90deg)}
.caisse-d .corps{padding:0 var(--s4) var(--s4)}
.caisse-d .corps p{font-size:var(--t13);color:var(--text-3);margin-top:var(--s2)}

/* ── Réglages (listes groupées) ── */
.groupe{background:var(--surface);border-radius:var(--r3);border:1px solid var(--line);box-shadow:var(--shadow-1);overflow:hidden}
.groupe+.groupe{margin-top:var(--s4)}
.g-titre{font-size:var(--t13);font-weight:600;color:var(--text-3);margin:var(--s6) var(--s4) var(--s2);text-transform:uppercase;letter-spacing:.04em}
.rl{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:var(--s2) var(--s4);text-align:left;transition:background .15s}
.rl:active{background:var(--surface-2)}
.rl+.rl{border-top:1px solid var(--line)}
.rl .r-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent-text)}
.rl .r-ic .ic{width:18px;height:18px}
.rl .g{flex:1;min-width:0}
.rl .t{font-weight:550;display:block}.rl .s{font-size:var(--t13);color:var(--text-3);display:block}
.rl>.ic:last-child{color:var(--text-3);width:18px;height:18px}
.pied{text-align:center;font-size:var(--t12);color:var(--text-3);margin-top:var(--s6)}
.c-form{padding:0;overflow:hidden}
.c-form .c-tete{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);color:#fff;background:linear-gradient(150deg,var(--g1),var(--g2))}
.c-form .c-tete b{flex:1;font-weight:650}
.c-form .c-tete span{font-size:var(--t13);color:rgba(255,255,255,.85)}
.c-form .c-corps{padding:var(--s4)}
.c-form .c-pied{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-top:1px solid var(--line);font-size:var(--t13);color:var(--text-2)}
.c-form .c-pied .btn{width:auto}
.sal-l{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0}
.sal-l .g{flex:1;font-weight:600}
.sal-l .field{max-width:160px;text-align:right}

/* ── Caisse filtrée (Activité) ── */
.c-hero{position:relative;overflow:hidden;border-radius:var(--r3);padding:var(--s5);color:#fff;
  background:radial-gradient(140% 100% at 100% 0%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%),linear-gradient(150deg,var(--g1),var(--g2));box-shadow:0 10px 24px -10px var(--g2)}
.c-hero .no{font-size:var(--t13);color:rgba(255,255,255,.85)}
.c-hero .mt{font-size:var(--t34);font-weight:700;letter-spacing:-.03em;margin-top:var(--s2)}
.c-hero .l{font-size:var(--t13);color:rgba(255,255,255,.82)}
.c-hero details.detail summary{color:#fff}
.c-hero .tableau td{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.18)}
.c-hero .tableau td:last-child,.c-hero .tableau tr.fort td{color:#fff}
.c-hero .tableau .pos,.c-hero .tableau .neg{color:#fff}

/* ── Toast ── */
#toast{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(var(--tab) + env(safe-area-inset-bottom) + var(--s4));z-index:95;display:flex;align-items:center;gap:var(--s3);
  max-width:528px;margin:0 auto;padding:10px 10px 10px 14px;min-height:56px;border-radius:var(--r2);background:var(--toast-bg);color:var(--toast-text);font-size:var(--t15);font-weight:550;
  box-shadow:0 12px 32px -8px rgba(0,0,0,.45);transform:translateY(16px) scale(.98);opacity:0;pointer-events:none;transition:transform .3s var(--ease-out),opacity .2s}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast-txt{flex:1;min-width:0}
#toast-ic{width:26px;height:26px;border-radius:var(--rf);display:grid;place-items:center;flex-shrink:0;background:#22C17E;color:#fff}
#toast-ic .ic{width:15px;height:15px;stroke-width:2.8}
#toast.err #toast-ic{background:#E5484D}
#toast-btn{min-height:40px;padding:0 12px;border-radius:10px;font-weight:700;color:#8F93FF;flex-shrink:0}
@media (prefers-color-scheme:light){#toast-btn{color:#A5A8FF}}
@media (prefers-color-scheme:dark){#toast-btn{color:var(--accent)}}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes stepIn{from{opacity:0;transform:translateX(18px)}}
@keyframes vueIn{from{opacity:0;transform:translateY(6px)}}
@keyframes secoue{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.vue-in{animation:vueIn .28s var(--ease-out) both}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--r2);background:var(--surface-2);gap:4px}
.seg3 button{min-height:44px;border-radius:11px;font-weight:600;font-size:var(--t13);color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:4px;transition:background .2s,color .2s}
.seg3 button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg3 button.on .ic{color:var(--pos)}
.kpi{display:block;width:100%}
.tx-mt small.warn{color:var(--warn)}
.tx-b .barre-c em{font-size:var(--t11)}
input[type=date].field{min-height:50px}
input[readonly].field{cursor:default}
</style>

/* ════════════════════════════════════════════════════════════════════
   LOGIQUE MÉTIER — pure, sans interface, testée par tests/test_logique.js
   ════════════════════════════════════════════════════════════════════ */
/*LOGIQUE-DEBUT*/
const L = (function () {
  'use strict';
  const APP = 'chantier-salon';
  const VERSION = 1;
  const JOUR_MS = 86400000;
  const TYPES = { materiau: 'Matériaux', main: 'Main-d’œuvre', transport: 'Transport', autre: 'Autre' };
  const MOYENS = { especes: 'Espèces', wave: 'Wave', om: 'Orange Money', autre: 'Autre' };
  const STATUTS = { a_faire: 'À faire', en_cours: 'En cours', termine: 'Terminé' };
  // [id, nom, description, icône, suggestions d'articles]
  const ETAPES_DEFAUT = [
    ['fondation', 'Fondation', 'Fouilles, fer, béton', 'layers', ['Fer', 'Ciment', 'Sable', 'Gravier', 'Fouilles']],
    ['maconnerie', 'Maçonnerie', 'Briques, ciment, fer, sable', 'brick', ['Briques', 'Ciment', 'Sable', 'Fer', 'Gravier', 'Eau']],
    ['toiture', 'Toiture', 'Charpente, tôles, plafond', 'roof', ['Tôles', 'Bois de charpente', 'Pointes', 'Plafond']],
    ['electricite', 'Électricité', 'Câbles, prises, lampes', 'bolt', ['Câbles', 'Prises', 'Interrupteurs', 'Disjoncteur', 'Lampes', 'Gaines']],
    ['plomberie', 'Plomberie', 'Tuyaux, robinets, lavabos', 'drop', ['Tuyaux', 'Robinets', 'Lavabo', 'Bac à shampoing', 'Raccords']],
    ['carrelage', 'Carrelage', 'Carreaux, colle, joints', 'grid', ['Carreaux', 'Colle', 'Joint', 'Plinthes']],
    ['menuiserie', 'Menuiserie', 'Portes, fenêtres, vitres', 'door', ['Porte', 'Fenêtres', 'Vitres', 'Serrure']],
    ['peinture', 'Peinture', 'Peinture, enduit', 'paint', ['Peinture', 'Enduit', 'Rouleaux', 'Pinceaux']],
    ['finition', 'Finition & déco', 'Plafond, éclairage, décoration', 'sparkle', ['Décoration', 'Rideaux', 'Enseigne', 'Éclairage']],
    ['equipement', 'Équipement du salon', 'Fauteuils, miroirs, bacs', 'chair', ['Fauteuils', 'Miroirs', 'Bacs', 'Sèche-cheveux', 'Étagères', 'Climatiseur']],
    ['divers', 'Divers', 'Transport, papiers, imprévus', 'dots', ['Transport', 'Autorisation', 'Gardiennage']],
  ];
  const COULEURS = ['#5B5FEF', '#14B8A6', '#F59E0B', '#EF4444', '#A855F7', '#0EA5E9', '#EC4899', '#84CC16', '#F97316', '#64748B', '#06B6D4', '#8B5CF6'];

  function E(msg) { return new Error(msg); }
  let _n = 0;
  function uid(p) { _n = (_n + 1) % 1e6; return (p || 'x') + Date.now().toString(36) + _n.toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function jourISO(t) { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  function dateCourte(j) { const [y, m, d] = j.split('-').map(Number); return JOURS[new Date(y, m - 1, d).getDay()] + ' ' + d + ' ' + MOIS_C[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : ''); }
  function nomMois(mois) { const [y, m] = mois.split('-').map(Number); return MOIS[m - 1] + ' ' + y; }
  function moisCourt(mois) { const [y, m] = mois.split('-').map(Number); return MOIS_C[m - 1] + (String(y).slice(2) !== String(new Date().getFullYear()).slice(2) ? ' ' + String(y).slice(2) : ''); }

  /* ── Montants : « 50k », « 1,2M », « 330 000 », « 1.500.000 F » ── */
  const SUFFIXES = { k: 1e3, mil: 1e3, mille: 1e3, m: 1e6, mio: 1e6, million: 1e6, millions: 1e6 };
  function parseMontant(v) {
    if (typeof v === 'number') return Number.isFinite(v) && v >= 0 ? Math.round(v) : null;
    if (v == null) return null;
    let s = String(v).trim().toLowerCase().replace(/[\s  ']/g, '');
    s = s.replace(/(fcfa|cfa|xof|francs|franc|f)$/, '');
    if (!s) return null;
    const m = s.match(/^([0-9]+(?:[.,][0-9]+)*)(millions|million|mille|mil|mio|k|m)?$/);
    if (!m) return null;
    const num = m[1], suf = m[2];
    let n;
    if (suf) {
      const seps = num.match(/[.,]/g) || [];
      if (seps.length > 1) { if (!/^\d{1,3}([.,]\d{3})+$/.test(num)) return null; n = Number(num.replace(/[.,]/g, '')); }
      else n = Number(num.replace(',', '.'));
      n *= SUFFIXES[suf];
    } else if (/^\d+$/.test(num)) n = Number(num);
    else if (/^\d{1,3}([.,]\d{3})+$/.test(num)) n = Number(num.replace(/[.,]/g, ''));
    else return null; // « 2,5 » sans k/M : ambigu en FCFA
    return Number.isFinite(n) ? Math.round(n) : null;
  }
  function lireMontant(v, zeroOk, quoi) {
    const m = parseMontant(v);
    if (m == null || (!zeroOk && m === 0)) throw E((quoi || 'Montant') + ' non compris. Exemples : 175000, 175k, 1,2M');
    return m;
  }
  /** Quantité : entier ou décimal (2,5 tonnes). */
  function lireQuantite(v) {
    if (v == null || String(v).trim() === '') return null;
    const n = Number(String(v).trim().replace(/[\s ]/g, '').replace(',', '.'));
    if (!Number.isFinite(n) || n <= 0) throw E('Quantité non comprise');
    return Math.round(n * 1000) / 1000;
  }
  function grouper(n) { return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function fmt(n) { return (n < 0 ? '−' : '') + grouper(n) + ' F'; }
  function fmtQte(q) { return String(q).replace('.', ','); }

  /* ── État ── */
  function etatInitial(now) {
    now = now == null ? Date.now() : now;
    return {
      app: APP, version: VERSION, creeLe: now, nom: 'Mon salon', budget: 0,
      etapes: ETAPES_DEFAUT.map((e, i) => ({ id: e[0], nom: e[1], description: e[2], icone: e[3], budget: 0, statut: 'a_faire', couleur: COULEURS[i % COULEURS.length] })),
      depenses: [], artisans: [], derniereSauvegarde: null,
    };
  }
  const etape = (st, id) => st.etapes.find(e => e.id === id) || null;
  const artisan = (st, id) => st.artisans.find(a => a.id === id) || null;
  const depense = (st, id) => st.depenses.find(d => d.id === id) || null;
  function suggestions(st, etapeId) { const e = ETAPES_DEFAUT.find(x => x[0] === etapeId); const deja = st.depenses.filter(d => d.etape === etapeId).map(d => d.libelle); return [...new Set((e ? e[4] : []).concat(deja))]; }
  function fournisseurs(st) { return [...new Set(st.depenses.map(d => d.fournisseur).filter(Boolean))].sort(); }

  /* ── Dépenses ── */
  function paye(d) { return d.paiements.reduce((s, p) => s + p.montant, 0); }
  function resteDu(d) { return d.montant - paye(d); }
  function verifierJour(j, now) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(j || '')) throw E('Date invalide');
    if (j > jourISO(now)) throw E('La date ne peut pas être dans le futur');
    return j;
  }
  /** o : { etape, type, libelle, quantite, unite, prixUnitaire, montant, fournisseur, artisan, moyen, jour, note, payeMaintenant } */
  function preparerDepense(st, o, now) {
    if (!etape(st, o.etape)) throw E('Choisis une étape');
    const type = TYPES[o.type] ? o.type : 'materiau';
    const libelle = String(o.libelle || '').trim().slice(0, 80);
    if (!libelle) throw E('Écris ce que tu as acheté ou payé');
    const quantite = lireQuantite(o.quantite);
    const pu = o.prixUnitaire == null || String(o.prixUnitaire).trim() === '' ? null : lireMontant(o.prixUnitaire, false, 'Prix unitaire');
    let montant;
    if (quantite != null && pu != null) montant = Math.round(quantite * pu);
    else montant = lireMontant(o.montant, false, 'Montant');
    const art = o.artisan ? artisan(st, o.artisan) : null;
    if (o.artisan && !art) throw E('Artisan introuvable');

    return { app: APP, version: VERSION, creeLe: Number.isFinite(d.creeLe) ? d.creeLe : Date.now(), nom: String(d.nom || 'Mon salon').slice(0, 40), budget: ent(d.budget) ? d.budget : 0,
      etapes, depenses, artisans, derniereSauvegarde: Number.isFinite(d.derniereSauvegarde) ? d.derniereSauvegarde : null };
  }

  return {
    APP, VERSION, TYPES, MOYENS, STATUTS, JOUR_MS,
    uid, pad, jourISO, dateCourte, nomMois, moisCourt, parseMontant, lireMontant, grouper, fmt, fmtQte,
    etatInitial, etape, artisan, depense, suggestions, fournisseurs,
    paye, resteDu, ajouterDepense, modifierDepense, payer, supprimerDepense, restaurerDepense,
    reglerEtape, ajouterEtape, ajouterArtisan, modifierArtisan, supprimerArtisan, etatArtisan,
    totaux, parMois, texteBilan, csv, analyserLigne, analyserVrac, ajouterVrac,
    rappelSauvegarde, exporter, importer, normaliser,
  };
})();
/*LOGIQUE-FIN*/

</script>

<script>
/* ════════════════════════════════════════════════════════════════════
   INTERFACE
   ════════════════════════════════════════════════════════════════════ */
'use strict';
// Clé de stockage propre à cette appli : ne touche jamais aux données de Caisses ni de PAIREDAS.
const CLE = 'chantier_salon_v1';
const CLE_PREFS = 'chantier_salon_prefs';
let S, PREFS = {}, alerteChargement = null;
const UI = { vue: 'accueil', retour: null, etape: null, artisan: null, filtre: '', recherche: '', nbListe: 80, feuille: null, form: null, vrac: null, importEnAttente: null, vueRendue: null };

function charger() {
  let brut = null;
  try { brut = localStorage.getItem(CLE); } catch (e) { alerteChargement = 'Ce navigateur bloque le stockage : les données ne seront pas gardées.'; }
  if (brut) {
    try { S = L.normaliser(JSON.parse(brut)); }
    catch (e) {
      try { localStorage.setItem(CLE + '_illisible_' + Date.now(), brut); } catch (_) {}
      alerteChargement = 'Les données n’ont pas pu être relues (' + e.message + '). Une copie a été gardée. Restaure ta dernière sauvegarde : Plus → Sauvegarde.';
      S = L.etatInitial();
    }
  } else S = L.etatInitial();
  try { PREFS = JSON.parse(localStorage.getItem(CLE_PREFS) || '{}') || {}; } catch (e) { PREFS = {}; }
}
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); return true; } catch (e) { toast('Enregistrement impossible sur ce téléphone (mémoire pleine ?)', null, 'err'); return false; } }
function sauverPrefs() { try { localStorage.setItem(CLE_PREFS, JSON.stringify(PREFS)); } catch (e) {} }

/* ── Photos des reçus : rangées à part (IndexedDB), pour ne pas remplir la mémoire principale ── */
const PH = {
  _db: null,
  ouvrir() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((ok, ko) => {
      if (!window.indexedDB) return ko(new Error('Photos impossibles sur ce navigateur'));
      const r = indexedDB.open('chantier_salon_photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { this._db = r.result; ok(this._db); };
      r.onerror = () => ko(r.error);
    });
  },
  async op(mode, f) { const db = await this.ouvrir(); return new Promise((ok, ko) => { const tx = db.transaction('photos', mode), st = tx.objectStore('photos'); const r = f(st); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ko(tx.error); }); },
  mettre(id, blob) { return this.op('readwrite', s => s.put(blob, id)); },
  lire(id) { return this.op('readonly', s => s.get(id)); },
  effacer(id) { return this.op('readwrite', s => s.delete(id)).catch(() => {}); },
};
async function compresser(fichier) {
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('Photo illisible')); i.src = URL.createObjectURL(fichier); });
  const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.7));
}

/* ── Petits outils ── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const F = n => L.fmt(n);
const auj = () => L.jourISO(Date.now());
const ICO = (n, c) => `<svg class="ic${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const typo = h => h.replace(/ ([?!:;»])/g, ' $1').replace(/« /g, '« ');
function jourLib(j) { if (j === auj()) return 'Aujourd’hui'; if (j === L.jourISO(Date.now() - L.JOUR_MS)) return 'Hier'; return L.dateCourte(j); }
function grand(n) { return `${n < 0 ? '−' : ''}${L.grouper(n)}<span class="cur">F</span>`; }
function court(n) { const a = Math.abs(n), s = n < 0 ? '−' : ''; if (a >= 1e6) return s + (Math.round(a / 1e5) / 10).toString().replace('.', ',') + ' M'; if (a >= 1e3) return s + Math.round(a / 1e3) + ' k'; return s + a; }
const coul = id => { const e = L.etape(S, id); return e ? e.couleur : '#64748B'; };
const NE = id => esc((L.etape(S, id) || {}).nom || '?');
const pastille = (id, taille) => { const e = L.etape(S, id); return `<span class="av${taille ? ' ' + taille : ''}" style="--g1:${coul(id)};--g2:color-mix(in srgb,${coul(id)} 55%,#000)" aria-hidden="true">${ICO(e ? e.icone : 'layers')}</span>`; };
const PILL_ST = { a_faire: 'p-gr', en_cours: 'p-at', termine: 'p-ok' };
const pillStatut = s => `<span class="pill ${PILL_ST[s]}">${s === 'termine' ? ICO('check') : ''}${L.STATUTS[s]}</span>`;
const ICO_MOYEN = { especes: 'cash', wave: 'phone', om: 'phone', autre: 'dots' };
const ICO_TYPE = { materiau: 'brick', main: 'users', transport: 'car', autre: 'dots' };

/* ── Toast ── */
let _tt = null;
function toast(msg, annuler, genre) {
  const t = $('#toast'), b = $('#toast-btn');
  $('#toast-txt').textContent = msg;
  t.classList.toggle('err', genre === 'err');
  $('#toast-ic').innerHTML = ICO(genre === 'err' ? 'alert' : genre === 'info' ? 'info' : 'check');
  if (annuler) { b.classList.remove('cache'); b.onclick = () => { t.classList.remove('on'); annuler(); }; } else { b.classList.add('cache'); b.onclick = null; }
  t.classList.add('on'); clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('on'), annuler ? 7000 : 3500);
}
function erreur(e) { toast(String((e && e.message) || e), null, 'err'); }

/* ── Rendu principal ── */
const ONGLETS = [['accueil', 'home', 'Accueil'], ['depenses', 'list', 'Dépenses'], null, ['etapes', 'layers', 'Étapes'], ['plus', 'sliders', 'Plus']];
const PARENT = { etape: 'etapes', artisans: 'plus', artisan: 'plus', projet: 'plus', sauvegarde: 'plus' };
function rendreNav() {
  const v = PARENT[UI.vue] || UI.vue, bk = L.rappelSauvegarde(S);
  $('#nav').innerHTML = '<div class="nav-in">' + ONGLETS.map(o => o
    ? `<button class="tab ${v === o[0] ? 'on' : ''}" data-act="vue" data-vue="${o[0]}" data-onglet="1" ${v === o[0] ? 'aria-current="page"' : ''}>${ICO(o[1])}<span>${o[2]}</span>${o[0] === 'plus' && bk.du ? '<span class="dot"></span>' : ''}</button>`
    : `<button class="fab" data-act="nouvelle" aria-label="Nouvelle dépense">${ICO('plus')}</button>`).join('') + '</div>';
}
function rendre() {
  const app = $('#app');
  app.innerHTML = typo((VUES[UI.vue] || VUES.accueil)());
  if (UI.vueRendue !== UI.vue) { app.classList.remove('vue-in'); void app.offsetWidth; app.classList.add('vue-in'); UI.vueRendue = UI.vue; }
  rendreNav();
  document.body.classList.toggle('prive', !!PREFS.prive);
}
function entete(titre, retour, droite) {
  return `<header class="ph">${retour ? `<button class="icon-btn nu back" data-act="vue" data-vue="${retour}" aria-label="Retour">${ICO('chev-l')}</button>` : ''}<h1>${titre}</h1>${droite || ''}</header>`;
}
function section(titre, droite, extra) { return `<div class="sec"><h2>${titre}${extra || ''}</h2>${droite || ''}</div>`; }
function alerte(genre, ic, titre, desc, bouton) {
  return `<div class="alerte ${genre}"><span class="a-ic">${ICO(ic)}</span><div class="a-b"><div class="a-t">${titre}</div>${desc ? `<div class="a-d">${desc}</div>` : ''}${bouton || ''}</div></div>`;
}
function barre(val, max, couleur, couleurTexte) {
  if (!max) return '';
  const pc = Math.round(val / max * 100), dep = val > max;
  return `<div class="barre-c"><i style="width:${Math.max(2, Math.min(100, pc))}%;background:${dep ? 'var(--neg)' : couleur || 'var(--accent)'}"></i><em class="num ${dep && !couleurTexte ? 'neg' : ''}"${couleurTexte ? ` style="color:${couleurTexte}"` : ''}>${pc} %</em></div>`;
}
function detailQte(d) { return d.quantite != null ? `${L.fmtQte(d.quantite)}${d.unite ? ' ' + esc(d.unite) : ''}${d.prixUnitaire ? ' × ' + F(d.prixUnitaire) : ''}` : ''; }
function ligneDep(d, sansEtape) {
  const r = L.resteDu(d), a = d.artisan && L.artisan(S, d.artisan);
  const sous = [sansEtape ? '' : NE(d.etape), detailQte(d), a ? esc(a.nom) : d.fournisseur ? esc(d.fournisseur) : ''].filter(Boolean).join(' · ');
  return `<button class="tx" data-act="dep" data-id="${esc(d.id)}">${pastille(d.etape)}<span class="tx-b"><span class="tx-t">${esc(d.libelle)}${d.photo ? ' ' + ICO('camera', 'xs') : ''}</span><span class="tx-s">${sous}</span></span>
    <span class="tx-mt num sens">${F(d.montant)}${r > 0 ? `<small class="warn">reste ${F(r)}</small>` : `<small>${esc(L.MOYENS[d.moyen])}</small>`}</span></button>`;
}
function depsTriees(f) { return S.depenses.filter(f || (() => true)).slice().sort((a, b) => b.jour.localeCompare(a.jour) || b.creeLe - a.creeLe); }
function listeParJour(deps, sansEtape) {
  const g = [];
  deps.forEach(d => { const x = g[g.length - 1]; if (x && x.j === d.jour) x.l.push(d); else g.push({ j: d.jour, l: [d] }); });
  return g.map(x => `<div class="jour"><span>${esc(jourLib(x.j))}</span><span class="num sens">${F(x.l.reduce((s, d) => s + d.montant, 0))}</span></div><div class="card flush liste">${x.l.map(d => ligneDep(d, sansEtape)).join('')}</div>`).join('');
}
const PALETTE = ['#5B5FEF', '#14B8A6', '#F59E0B', '#EF4444', '#A855F7', '#0EA5E9', '#EC4899', '#84CC16'];
function listeBarres(items, lib, total, couleur) {
  const mx = Math.max(1, ...items.map(x => x.montant));
  return `<div class="cmp" style="grid-template-columns:104px 1fr">${items.map((x, i) => `<span class="k" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lib(x)}</span><div class="barre-c"><i style="width:${Math.max(3, Math.round(x.montant / mx * 100))}%;background:${couleur ? couleur(x) : PALETTE[i % PALETTE.length]}"></i><em class="num sens">${court(x.montant)}${total ? ' · ' + Math.round(x.montant / total * 100) + ' %' : ''}</em></div>`).join('')}</div>`;
}
function graphMois(series) {
  const W = 320, H = 130, G = 30, B = 18, n = series.length, max = Math.max(1, ...series.map(x => x.montant));
  const pas = Math.pow(10, Math.floor(Math.log10(max))), haut = Math.ceil(max / pas) * pas;
  const y = v => 10 + (H - B - 10) * (1 - v / haut), lw = (W - G) / n, bw = Math.min(26, lw * 0.6);
  let s = `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses par mois">`;
  for (let k = 0; k <= 2; k++) { const v = haut * k / 2; s += `<line class="grille" x1="${G}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${G - 5}" y="${y(v) + 3}" text-anchor="end">${court(v)}</text>`; }
  series.forEach((m, i) => {
    const cx = G + lw * i + lw / 2, hh = Math.max(m.montant ? 2 : 0, y(0) - y(m.montant));
    s += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(y(0) - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" style="fill:var(--accent)"/><text x="${cx}" y="${H - 4}" text-anchor="middle">${esc(L.moisCourt(m.mois))}</text>`;
  });
  return s + '</svg>';
}

/* ── VUES ── */
const VUES = {};
VUES.accueil = () => {
  const t = L.totaux(S), bk = L.rappelSauvegarde(S);
  let h = `<header class="top"><div><div class="hello">${esc(S.nom)}</div><div class="date">Chantier · ${t.terminees}/${t.nbEtapes} étapes terminées</div></div>
    <div class="top-actions"><button class="icon-btn" data-act="prive" aria-label="${PREFS.prive ? 'Afficher les montants' : 'Masquer les montants'}" aria-pressed="${!!PREFS.prive}">${ICO(PREFS.prive ? 'eye-off' : 'eye')}</button>
    <button class="icon-btn" data-act="partager" aria-label="Partager le bilan">${ICO('share')}</button></div></header>`;
  if (alerteChargement) h += alerte('err', 'alert', 'Problème de lecture', esc(alerteChargement));
  if (!S.depenses.length) h += alerte('', 'list', 'Ajoute ta liste de dépenses', 'Colle ta liste telle quelle (« briques 300 000 », « ciment 20 sacs à 5 500 »…) : l’appli range tout dans les bonnes étapes.', `<button class="btn btn-pri sm" data-act="vrac">${ICO('list')}Saisie en vrac</button>`);
  else if (bk.du) h += alerte('at', 'shield', 'Pense à la sauvegarde', bk.jamais ? 'Tes dépenses ne sont que sur ce téléphone.' : 'Dernière il y a ' + bk.jours + ' jours.', `<button class="btn btn-pri sm" data-act="vue" data-vue="sauvegarde">Sauvegarder</button>`);
  h += `<section class="hero" aria-label="Total dépensé"><div class="hero-top"><span>Total dépensé</span><span>${t.nb} dépense${t.nb > 1 ? 's' : ''}</span></div>
    <div class="hero-amt num sens">${grand(t.depense)}</div>
    <div class="hero-var"><span class="vpill num sens">${ICO('check', 'xs')}payé ${F(t.paye)}</span>${t.resteFactures ? `<span class="vpill down num sens">reste ${F(t.resteFactures)}</span>` : ''}</div>
    ${t.budget ? `<div style="margin-top:var(--s4)">${barre(t.depense, t.budget, '#A9ADFF', 'rgba(255,255,255,.8)')}</div>` : ''}
    <div class="hero-pied" style="margin-top:var(--s3)"><span>${t.budget ? 'Budget ' + F(t.budget) : '<button data-act="vue" data-vue="projet" style="color:inherit;text-decoration:underline">Fixer un budget total</button>'}</span><span>${t.budget ? (t.budget - t.depense >= 0 ? 'reste ' + F(t.budget - t.depense) : 'dépassé de ' + F(t.depense - t.budget)) : ''}</span></div></section>`;
  h += `<div class="kpis" style="margin-top:var(--s3)">
    <button class="kpi" style="text-align:left" data-act="vue" data-vue="etapes"><span>Coût final estimé</span><b class="num sens">${F(t.estimation)}</b>${t.estimationFiable ? '<span class="delta bon">budgets complets</span>' : '<span class="delta">à affiner</span>'}<small>${t.estimationFiable ? 'd’après tes budgets' : 'mets un budget par étape'}</small></button>
    <button class="kpi" style="text-align:left" data-act="vue" data-vue="artisans"><span>Reste à payer</span><b class="num sens ${t.resteAPayer ? 'warn' : ''}">${F(t.resteAPayer)}</b><small>${t.resteContrats ? 'dont artisans ' + F(t.resteContrats) : 'factures et artisans'}</small></button></div>`;
  const actives = t.parEtape.filter(x => x.depense || x.etape.budget || x.etape.statut !== 'a_faire');
  h += section('Par étape', `<button class="lien" data-act="vue" data-vue="etapes" data-onglet="1">Toutes${ICO('chev-r', 'xs')}</button>`);
  h += actives.length ? `<div class="card flush liste">${actives.map(ligneEtape).join('')}</div>` : `<div class="card"><div class="vide"><span class="v-ic n">${ICO('layers')}</span><div><div class="v-t">Aucune étape commencée</div><div class="v-d">Les étapes apparaissent ici dès la première dépense.</div></div></div></div>`;
  if (t.parType.length) h += section('Matériaux ou main-d’œuvre') + `<div class="card">${listeBarres(t.parType, x => esc(L.TYPES[x.type]), t.depense)}</div>`;
  const pm = L.parMois(S);
  if (pm.length > 1) h += section('Dépenses par mois') + `<div class="card">${graphMois(pm)}</div>`;
  const der = depsTriees().slice(0, 5);
  h += section('Dernières dépenses', der.length ? `<button class="lien" data-act="vue" data-vue="depenses" data-onglet="1">Tout voir${ICO('chev-r', 'xs')}</button>` : '');
  h += der.length ? `<div class="card flush liste">${der.map(d => ligneDep(d)).join('')}</div>` : `<div class="card"><div class="vide"><span class="v-ic n">${ICO('list')}</span><div><div class="v-t">Rien encore</div><div class="v-d">Touche ＋ pour noter une dépense.</div></div></div></div>`;
  return h;
};
function ligneEtape(x) {
  const e = x.etape;
  return `<button class="tx" data-act="voir-etape" data-id="${esc(e.id)}">${pastille(e.id)}<span class="tx-b"><span class="tx-t">${esc(e.nom)}</span>
    ${e.budget ? `<span style="margin-top:4px">${barre(x.engage, e.budget, e.couleur)}</span>` : `<span class="tx-s">${x.nb ? x.nb + ' dépense' + (x.nb > 1 ? 's' : '') : esc(e.description)}</span>`}</span>

VUES.depenses = () => {

VUES.etapes = () => {
  const t = L.totaux(S);

function rendreFeuille(entree) {
  const el = $('#feuille'), f = UI.feuille;
  if (!f) {
    if (el.classList.contains('on')) { el.classList.remove('on'); el.classList.add('sort'); clearTimeout(_ferme); _ferme = setTimeout(() => { if (!UI.feuille) { el.classList.remove('sort'); el.innerHTML = ''; } }, 240); }

500 briques à 350
Ciment 20 sacs x 5 500
Fer 150k
Avance maçon 50 000
Carreaux 1,2M">${esc(v.texte)}</textarea>

ACT['f-etape'] = d => { lireForm(); UI.form.etape = d.id; if (UI.form.artisan && L.artisan(S, UI.form.artisan) && L.artisan(S, UI.form.artisan).etape && L.artisan(S, UI.form.artisan).etape !== d.id) UI.form.artisan = ''; rendreFeuille(); };

ACT['f-ok'] = async () => {

  PREFS.etape = f.etape; PREFS.moyen = f.moyen; sauverPrefs();

  if (f.id) toast('Dépense modifiée');
  else toast(`${dep.libelle} · ${F(dep.montant)} → ${L.etape(S, dep.etape).nom}`, () => { const i = S.depenses.findIndex(x => x.id === dep.id); if (i >= 0) S.depenses.splice(i, 1); PH.effacer(dep.id); sauver(); rendre(); toast('Annulé', null, 'info'); });
};
ACT.dep = d => ouvrir({ type: 'detail', id: d.id });
ACT['retour-detail'] = () => { UI.feuille = { type: 'detail', id: UI.feuille.id }; rendreFeuille(); };

ACT['pa-moyen'] = (d, b) => { UI.feuille.moyen = d.val; b.parentElement.querySelectorAll('.puce').forEach(x => x.classList.toggle('on', x === b)); };
ACT['pa-ok'] = d => {

ACT['v-moyen'] = (d, b) => { UI.vrac.moyen = d.val; b.parentElement.querySelectorAll('.puce').forEach(x => x.classList.toggle('on', x === b)); };

ACT.statut = d => { L.reglerEtape(S, UI.etape, { statut: d.val }); sauver(); rendre(); toast(L.etape(S, UI.etape).nom + ' : ' + L.STATUTS[d.val].toLowerCase()); };
ACT['etape-budget'] = () => { const e = L.reglerEtape(S, UI.etape, { budget: $('#eb').value }); sauver(); rendre(); toast(e.budget ? 'Budget ' + e.nom + ' : ' + F(e.budget) : 'Budget retiré'); };

ACT['a-ok'] = d => {

  const a = d.id ? L.modifierArtisan(S, d.id, o) : L.ajouterArtisan(S, o);

};
ACT['artisan-suppr'] = d => ouvrir({ type: 'confirm', titre: 'Supprimer ' + L.artisan(S, d.id).nom + ' ?', texte: 'Il n’a aucun paiement noté.', bouton: 'Supprimer', act: 'artisan-suppr-ok', id: d.id, danger: true });
ACT['artisan-suppr-ok'] = d => { L.supprimerArtisan(S, d.id); sauver(); fermer(); UI.vue = 'artisans'; rendre(); toast('Artisan supprimé'); };

// Projet, partage, export
ACT['projet-enreg'] = () => {
  const n = $('#pj-nom').value.trim(), b = $('#pj-budget').value.trim();
  if (!n) throw new Error('Donne un nom au chantier');
  const bm = b ? L.lireMontant(b, true, 'Budget') : 0;
  S.nom = n.slice(0, 40); S.budget = bm; sauver(); rendre(); toast('Projet enregistré');
};
ACT.partager = async () => {
  const t = L.texteBilan(S);
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(t); toast('Bilan copié : colle-le dans WhatsApp', null, 'info'); }
  catch (e) { window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); }
};
function telecharger(texte, nomF, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([texte], { type })); a.download = nomF;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function partagerFichier(texte, nomF, types) {
  if (!navigator.share || !navigator.canShare) return false;
  for (const t of types) { const f = new File([texte], nomF, { type: t }); if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nomF }); return true; } }
  return false;
}
ACT.csv = async () => {
  if (!S.depenses.length) throw new Error('Aucune dépense à exporter');
  const nomF = 'chantier-depenses-' + auj() + '.csv', c = L.csv(S);
  try { if (await partagerFichier(c, nomF, ['text/csv', 'text/plain'])) return; } catch (e) { if (e && e.name === 'AbortError') return; }
  telecharger(c, nomF, 'text/csv'); toast('Tableau téléchargé : ouvre-le avec Excel ou Google Sheets', null, 'info');
};
ACT.exporter = async d => {
  const ancien = S.derniereSauvegarde; S.derniereSauvegarde = Date.now();
  const txt = L.exporter(S), nomF = 'chantier-sauvegarde-' + auj() + '.json';
  if (d.partager) {
    try { if (await partagerFichier(txt, nomF, ['application/json', 'text/plain'])) { sauver(); rendre(); toast('Sauvegarde envoyée'); return; } toast('Envoi impossible ici : utilise « Télécharger »', null, 'err'); }
    catch (e) { if (e && e.name !== 'AbortError') toast('Envoi impossible : utilise « Télécharger »', null, 'err'); }
    S.derniereSauvegarde = ancien; return;
  }
  telecharger(txt, nomF, 'application/json'); sauver(); rendre(); toast('Fichier de sauvegarde téléchargé');
};
ACT.importer = () => { const i = $('#fichier'); if (i) { i.value = ''; i.click(); } };
ACT['import-ok'] = () => {
  try { localStorage.setItem(CLE + '_avant_import', JSON.stringify(S)); } catch (e) {}
  S = UI.importEnAttente; UI.importEnAttente = null; alerteChargement = null;
  sauver(); fermer(); UI.vue = 'accueil'; rendre(); toast('Sauvegarde restaurée');
};
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _installPrompt = e; });
ACT.installer = async () => {
  if (_installPrompt) { _installPrompt.prompt(); await _installPrompt.userChoice; _installPrompt = null; return; }
  if (window.matchMedia('(display-mode: standalone)').matches) { toast('L’appli est déjà installée'); return; }
  toast('Menu du navigateur (⋮ ou Partager) → « Ajouter à l’écran d’accueil »', null, 'info');
};

/* ── Écouteurs globaux ── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  try { const r = f(b.dataset, b, e); if (r && r.catch) r.catch(erreur); } catch (err) { erreur(err); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (['f-q', 'f-pu', 'f-mt'].includes(t.id)) majTotal();
  if (t.id === 'recherche') { UI.recherche = t.value; const pos = t.selectionStart; rendre(); const r = $('#recherche'); if (r) { r.focus(); try { r.setSelectionRange(pos, pos); } catch (_) {} } }
});
document.addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.id === 'f-credit') { $('#f-credit-z').classList.toggle('cache', !t.checked); if (t.checked) $('#f-paye').focus(); }
    if (t.id === 'f-photo' && t.files && t.files[0]) { UI.form.photoBlob = await compresser(t.files[0]); $('#f-photo-t').textContent = 'Photo du reçu prête ✓'; }
    if (t.id === 'fichier' && t.files && t.files[0]) {
      const lecteur = new FileReader();
      lecteur.onload = () => { try { UI.importEnAttente = L.importer(String(lecteur.result)); ouvrir({ type: 'import' }); } catch (err) { erreur(err); } };
      lecteur.readAsText(t.files[0]);
    }
  } catch (err) { erreur(err); }
});
document.addEventListener('keydown', e => {
  if (!UI.feuille) return;
  if (e.key === 'Escape') { fermer(); return; }
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const a = { dep: 'f-ok', payer: 'pa-ok', artisan: 'a-ok' }[UI.feuille.type]; if (!a) return;
  e.preventDefault(); const b = document.querySelector(`[data-act="${a}"]`); if (b) b.click();
});

/* ── Liste reçue par lien : …/chantier/#vrac=<texte en base64url> ──
   Le texte reste dans le lien (après #), il n'est envoyé à aucun serveur. */
function empreinte(t) { let h = 5381; const s = String(t).replace(/[\s\u00a0\u202f]+/g, ''); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function listeDuLien() {
  const m = location.hash.match(/^#vrac=([A-Za-z0-9_-]+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let texte;
  try { const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/')); texte = new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); }
  catch (e) { toast('Lien de liste illisible', null, 'err'); return; }
  UI.vrac = { texte, jour: auj(), moyen: PREFS.moyen || 'especes', lignes: null, duLien: true, deja: (PREFS.listesLiens || {})[empreinte(texte)] || null };
  ouvrir({ type: 'vrac', plein: true });
}

/* ── Démarrage ── */
charger();
rendre();
listeDuLien();
window.addEventListener('hashchange', listeDuLien);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
